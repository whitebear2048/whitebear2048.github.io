<div class="wrap" data-page-node-id="YpE98wGppqMiokfMKSeg4o">

  <header data-page-node-id="NWtFs3oPeTl0n3a7bXykBE">
    <h1>k 空间中电子与空穴的运动：实际情况 vs 简化模型</h1>
  </header>

  <div class="card" data-page-node-id="A9iFrBnGr9E7qB1IABY61C">
    <div class="panel-title">控制台</div>
    <div class="controls">
      <button id="btnReset">↺ 全部重置</button>
      <div class="ctrl">电场方向：
        <select id="selDir">
          <option value="1">+ℰ（电子向 −k 跃迁）</option>
          <option value="-1">−ℰ（电子向 +k 跃迁）</option>
        </select>
      </div>
      <div class="ctrl"><label><input type="checkbox" id="ckLabel" checked> 显示字母标记</label></div>
    </div>
    <div class="legend" data-page-node-id="BIDxWqV9WxkYQZIy1DETSm">
      <span data-page-node-id="MjwDod9c74zrwOEE6u5Abe"><span class="dot" style="background:#4a3fb5" data-page-node-id="Z1UVpk9mwSFNYzLXpvZYpc"></span>电子</span>
      <span data-page-node-id="ffHSnbzRbGdBDofcYBu22d"><span class="hole-dot" data-page-node-id="l3Gg6RCqu7xp4JWWos6vYK"></span>空穴（空态）</span>
      <span data-page-node-id="fbecNqHqATn9pC3LC9ZOtN"><span class="dot" style="background:#ef4444" data-page-node-id="wh0uzNgNLzaZvl06fSPdw3"></span>标记电子 X / Y / Z / A / B / C / E</span>
    </div>
  </div>

  <div class="card">
    <div class="panel-title">实际情况：相邻电子逐个跃入空位</div>
    <div class="controls pctrl">
      <button id="btnStepA">下一步 ▶</button>
      <button id="btnBackA">◀ 上一步</button>
      <button id="btnResetA">↺ 重置本面板</button>
    </div>
    <canvas id="cs" width="920" height="400"></canvas>
  </div>

  <div class="card">
    <div class="panel-title">简化模型：全体电子同步平移</div>
    <div class="controls pctrl">
      <button id="btnAutoB">▶ 自动移动</button>
      <button id="btnResetB">↺ 重置本面板</button>
      <div class="ctrl">间隔：
        <select id="selSpeedB">
          <option value="900">0.9 s / 步</option>
          <option value="600" selected>0.6 s / 步</option>
          <option value="350">0.35 s / 步</option>
        </select>
      </div>
    </div>
    <canvas id="ck" width="920" height="450"></canvas>
  </div>

</div>

<script>
(function(){
  "use strict";
  var W = 920;
  var P1 = {h:450, pl:70, pr:34, pt:76, pb:80};   // 面板二（简化模型）画布参数

  var cs = document.getElementById("cs"), csx = cs.getContext("2d");   // 面板一：实际情况
  var ck = document.getElementById("ck"), ckx = ck.getContext("2d");   // 面板二：简化模型

  /* ---------- 离散 k 状态格点 ---------- */
  var N = 13;                                   // 布里渊区内 13 个状态
  var K = [];                                   // K[i] = 第 i 个状态的波矢
  for (var i = 0; i < N; i++) K.push(-Math.PI + i * 2 * Math.PI / N);

  function kx(k, pl, pr){ return pl + (k + Math.PI) / (2*Math.PI) * (W - pl - pr); }
  function En(k){ return (1 - Math.cos(k)) / 2; }        // 归一化能量，底 0 顶 1
  function yOf(en){ return P1.pt + (1 - en) * (P1.h - P1.pt - P1.pb); }
  function mod(a, m){ return ((a % m) + m) % m; }

  /* 状态列：两个面板共用同一套横坐标 */
  var SLOT = (W - P1.pl - P1.pr) / N;            // 相邻状态列间距
  function colX(i){ return P1.pl + i * SLOT; }   // 与 kx(K[i]) 完全一致

  /* ---------- 电子与空穴：两个面板各自持有独立的状态与步数 ---------- */
  var HOLE0 = 12;                                // 初始空态：最右端（带顶 +π/a 侧）
  // 沿能带自下而上的顺序：E → C → B → A → 空穴 →（跨区边界）→ X → Y → Z
  var labelSpec = {
    0:{t:"X", c:"#ef4444"}, 1:{t:"Y", c:"#e8930c"}, 2:{t:"Z", c:"#10b981"},
   11:{t:"A", c:"#3b82f6"}, 10:{t:"B", c:"#8b5cf6"}, 9:{t:"C", c:"#ec4899"}, 8:{t:"E", c:"#0e9f9f"}
  };
  var dir = 1, showLabels = true;

  /* 面板一状态：slots 数组记录每个 k 态是否被占据，逐个电子跃入空位 */
  var slots = [], holeA = HOLE0, lastSwap = null;
  var stepA = 0, trailA = [], flashA = -10;
  function buildA(){
    slots = [];
    for (var i = 0; i < N; i++){
      if (i === HOLE0){ slots.push(null); continue; }
      var sp = labelSpec[i];
      slots.push({ label: sp ? sp.t : null, color: sp ? sp.c : "#4a3fb5" });
    }
    holeA = HOLE0; lastSwap = null; stepA = 0; trailA = []; flashA = -10;
  }

  /* 面板二状态：全体电子同占据索引，整体同步平移 */
  var electrons = [], holeB = HOLE0;
  var stepB = 0, trailB = [], flashB = -10;
  function buildB(){
    electrons = [];
    for (var i = 0; i < N; i++){
      if (i === HOLE0) continue;
      var sp = labelSpec[i] || {t:null, c:"#4a3fb5"};
      electrons.push({ idx:i, label:sp.t, color:sp.c, r: sp.t ? 8.5 : 7 });
    }
    holeB = HOLE0; stepB = 0; trailB = []; flashB = -10;
  }
  buildA(); buildB();

  /* ---------- 面板一跃迁：一次只有一个相邻电子跃入空位 ---------- */
  function doStepA(sign){
    var delta = (dir > 0) ? -1 : 1;                 // 电子跃迁方向（索引增量）
    var j = (sign > 0) ? mod(holeA - delta, N) : mod(holeA + delta, N);
    var mover = slots[j];
    trailA.push(holeA); if (trailA.length > 4) trailA.shift();
    lastSwap = { from:j, to:holeA, label:(mover && mover.label) ? mover.label : "电子",
                 color:(mover && mover.color) ? mover.color : "#4a3fb5" };
    slots[holeA] = mover;
    slots[j] = null;
    holeA = j;
    stepA += sign;
    flashA = performance.now() / 1000;
    paint();
  }

  /* ---------- 面板二跃迁：全体电子同步平移一格 ---------- */
  function doStepB(){
    var d = (dir > 0) ? -1 : 1;                     // ℰ>0 时电子向 −k 跃迁
    trailB.push(holeB); if (trailB.length > 4) trailB.shift();
    electrons.forEach(function(e){ e.idx = mod(e.idx + d, N); });
    holeB = mod(holeB + d, N);
    stepB += 1;
    flashB = performance.now() / 1000;
    paint();
  }

  /* ---------- 控件：两个面板分别控制 ---------- */
  var btnStepA = document.getElementById("btnStepA"), btnBackA = document.getElementById("btnBackA");
  var btnResetA = document.getElementById("btnResetA");
  var btnAutoB = document.getElementById("btnAutoB"), btnResetB = document.getElementById("btnResetB");
  var selSpeedB = document.getElementById("selSpeedB"), btnReset = document.getElementById("btnReset");
  var selDir = document.getElementById("selDir"), ckLabel = document.getElementById("ckLabel");
  var autoB = false, autoTimerB = null, gapB = 600;

  // 面板一：手动逐步
  btnStepA.addEventListener("click", function(){ doStepA(1); });
  btnBackA.addEventListener("click", function(){ if (stepA > 0) doStepA(-1); });
  btnResetA.addEventListener("click", function(){ stopAutoB(); buildA(); paint(); });

  // 面板二：点击后自动连续移动
  function stopAutoB(){ autoB = false; clearInterval(autoTimerB); btnAutoB.classList.remove("on"); btnAutoB.textContent = "▶ 自动移动"; }
  function startAutoB(){ autoB = true; btnAutoB.classList.add("on"); btnAutoB.textContent = "⏸ 停止"; autoTimerB = setInterval(doStepB, gapB); }
  btnAutoB.addEventListener("click", function(){ if (autoB) stopAutoB(); else startAutoB(); });
  selSpeedB.addEventListener("change", function(){ gapB = parseInt(selSpeedB.value, 10); if (autoB){ stopAutoB(); startAutoB(); } });
  btnResetB.addEventListener("click", function(){ stopAutoB(); buildB(); paint(); });

  btnReset.addEventListener("click", function(){ stopAutoB(); buildA(); buildB(); paint(); });
  selDir.addEventListener("change", function(){ dir = parseInt(selDir.value, 10); paint(); });
  ckLabel.addEventListener("change", function(){ showLabels = ckLabel.checked; paint(); });
  document.addEventListener("keydown", function(ev){
    if (ev.key === "ArrowRight" || ev.key === " "){ ev.preventDefault(); doStepA(1); }
    else if (ev.key === "ArrowLeft"){ ev.preventDefault(); if (stepA > 0) doStepA(-1); }
  });

  /* ---------- 绘图工具 ---------- */
  function arrow(c, x, y, len, color, lw){
    var ex = x + len, s = Math.sign(len) * 10;
    c.strokeStyle = color; c.fillStyle = color; c.lineWidth = lw || 4;
    c.beginPath(); c.moveTo(x, y); c.lineTo(ex, y); c.stroke();
    c.beginPath(); c.moveTo(ex, y); c.lineTo(ex - s, y - 6); c.lineTo(ex - s, y + 6); c.closePath(); c.fill();
  }
  function curveArrow(c, x1, y1, x2, y2, cx, cy, color){
    // 先描一层白色底衬：跃迁弧线即使与 E-k 能带曲线靠近（甚至颜色相近），也能清晰分辨
    c.lineCap = "round"; c.lineJoin = "round";
    c.strokeStyle = "rgba(255,255,255,.95)"; c.lineWidth = 7;
    c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo(cx, cy, x2, y2); c.stroke();
    c.strokeStyle = color; c.fillStyle = color; c.lineWidth = 3;
    c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo(cx, cy, x2, y2); c.stroke();
    var tx = x2 - cx, ty = y2 - cy, L = Math.sqrt(tx * tx + ty * ty) || 1;
    tx /= L; ty /= L; var px = -ty, py = tx;
    // 箭头：先铺稍大的白色三角做衬底，再填色，避免压在能带上看不清
    c.beginPath(); c.moveTo(x2, y2);
    c.lineTo(x2 - tx * 15 + px * 8.5, y2 - ty * 15 + py * 8.5);
    c.lineTo(x2 - tx * 15 - px * 8.5, y2 - ty * 15 - py * 8.5);
    c.closePath();
    c.fillStyle = "rgba(255,255,255,.95)"; c.fill();
    c.beginPath(); c.moveTo(x2, y2);
    c.lineTo(x2 - tx * 11 + px * 6, y2 - ty * 11 + py * 6);
    c.lineTo(x2 - tx * 11 - px * 6, y2 - ty * 11 - py * 6);
    c.closePath();
    c.fillStyle = color; c.fill();
    c.lineCap = "butt";
  }
  function text(c, txt, x, y, color, font, align){
    c.font = font || "bold 15px 'Microsoft YaHei'";
    c.textAlign = align || "left"; c.textBaseline = "middle";
    c.lineWidth = 4; c.strokeStyle = "rgba(255,255,255,.95)";
    c.strokeText(txt, x, y); c.fillStyle = color; c.fillText(txt, x, y);
  }

  /* ---------- 面板二：简化模型（全体电子同步平移） ---------- */
  function drawP1(now){
    var c = ckx, H = P1.h, yBase = H - P1.pb, x0 = kx(0, P1.pl, P1.pr);
    c.clearRect(0, 0, W, H);
    c.fillStyle = "#fbfaff"; c.fillRect(0, 0, W, H);

    // 坐标轴
    c.strokeStyle = "#a9a9c8"; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x0, 20); c.lineTo(x0, yBase + 8); c.stroke();
    c.beginPath(); c.moveTo(P1.pl - 14, yBase); c.lineTo(W - P1.pr, yBase); c.stroke();
    c.fillStyle = "#77779c"; c.font = "15px 'Microsoft YaHei'"; c.textAlign = "center";
    c.fillText("E", x0 + 18, 26);
    c.fillText("k", W - P1.pr + 2, yBase + 20);
    c.fillText("−π/a", P1.pl + 12, yBase + 20);
    c.fillText("0", x0, yBase + 20);
    c.fillText("π/a", W - P1.pr - 16, yBase + 20);

    // 能带曲线
    c.strokeStyle = "#5b4fc4"; c.lineWidth = 3;
    c.beginPath();
    for (var k = -Math.PI; k <= Math.PI + 1e-6; k += 0.02){
      var px = kx(k, P1.pl, P1.pr), py = yOf(En(k));
      if (k < -Math.PI + 1e-6) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.stroke();
    text(c, "价带顶", P1.pl + 6, yOf(1) + 16, "#8a8aad", "13px 'Microsoft YaHei'");
    text(c, "带底", x0 + 10, yOf(0) - 16, "#8a8aad", "13px 'Microsoft YaHei'");

    // 电场箭头
    c.strokeStyle = "#0e9f9f";
    var fx = W - P1.pr - 190, fy = 30;
    arrow(c, fx, fy, dir * 70, "#0e9f9f", 4);
    text(c, "ℰ", fx + dir * 70 + dir * 16, fy, "#0e9f9f", "bold 17px 'Microsoft YaHei'", dir > 0 ? "left" : "right");
    text(c, "ℏ·dk/dt = −e·ℰ", fx - 150, 30, "#77779c", "14px Consolas");

    // 状态列参考线（与面板二的列一一对应）
    c.setLineDash([3,4]); c.lineWidth = 1;
    for (var gi = 0; gi < N; gi++){
      c.beginPath(); c.strokeStyle = "rgba(91,79,196,.20)";
      c.moveTo(colX(gi), yOf(En(K[gi]))); c.lineTo(colX(gi), yBase); c.stroke();
    }
    c.setLineDash([]);

    // 状态格点
    for (var i = 0; i < N; i++){
      var gx = kx(K[i], P1.pl, P1.pr), gy = yOf(En(K[i]));
      c.beginPath(); c.arc(gx, gy, 4, 0, 6.284);
      c.fillStyle = "#ffffff"; c.fill();
      c.strokeStyle = "#c3bfe6"; c.lineWidth = 1.5; c.stroke();
    }

    // 空穴历史虚影
    trailB.forEach(function(ti, n){
      var gx = kx(K[ti], P1.pl, P1.pr), gy = yOf(En(K[ti]));
      c.beginPath(); c.arc(gx, gy, 9, 0, 6.284);
      c.strokeStyle = "rgba(224,83,61," + (0.10 + 0.10 * n) + ")"; c.lineWidth = 2; c.stroke();
    });

    // 电子
    electrons.forEach(function(e){
      var px = kx(K[e.idx], P1.pl, P1.pr), py = yOf(En(K[e.idx]));
      c.beginPath(); c.arc(px, py, e.r, 0, 6.284);
      c.fillStyle = e.color; c.fill();
      c.strokeStyle = "rgba(255,255,255,.85)"; c.lineWidth = 1.5; c.stroke();
      if (e.label && showLabels) text(c, e.label, px + 13, py - 15, e.color, "bold 17px 'Microsoft YaHei'");
    });

    // 空穴
    var hx = kx(K[holeB], P1.pl, P1.pr), hy = yOf(En(K[holeB]));
    var age = now - flashB;
    if (age < 0.8){
      c.beginPath(); c.arc(hx, hy, 13 + 14 * age, 0, 6.284);
      c.strokeStyle = "rgba(224,83,61," + (0.55 * (1 - age / 0.8)) + ")"; c.lineWidth = 3; c.stroke();
    }
    c.beginPath(); c.arc(hx, hy, 11, 0, 6.284);
    c.fillStyle = "#ffffff"; c.fill();
    c.lineWidth = 4; c.strokeStyle = "#e0533d"; c.stroke();
    text(c, "空穴", hx, (hy - 30 < 56) ? hy + 32 : hy - 30, "#e0533d", "bold 16px 'Microsoft YaHei'", "center");

  }

  /* ---------- 面板一：实际情况（相邻电子逐个跃入空位） ---------- */
  function drawPS(now){
    var c = csx, H = 400, pt = 96, pb = 64, yBase = H - pb;
    var eny = function(en){ return pt + (1 - en) * (H - pt - pb); };
    var x0 = kx(0, P1.pl, P1.pr);
    c.clearRect(0, 0, W, H);
    c.fillStyle = "#fbfaff"; c.fillRect(0, 0, W, H);

    // 坐标轴
    c.strokeStyle = "#a9a9c8"; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x0, 18); c.lineTo(x0, yBase + 8); c.stroke();
    c.beginPath(); c.moveTo(P1.pl - 14, yBase); c.lineTo(W - P1.pr, yBase); c.stroke();
    c.fillStyle = "#77779c"; c.font = "15px 'Microsoft YaHei'"; c.textAlign = "center";
    c.fillText("E", x0 + 18, 24);
    c.fillText("k", W - P1.pr + 2, yBase + 20);
    c.fillText("−π/a", P1.pl + 12, yBase + 20);
    c.fillText("0", x0, yBase + 20);
    c.fillText("π/a", W - P1.pr - 16, yBase + 20);

    // 能带曲线
    c.strokeStyle = "#5b4fc4"; c.lineWidth = 3;
    c.beginPath();
    for (var k = -Math.PI; k <= Math.PI + 1e-6; k += 0.02){
      var px = kx(k, P1.pl, P1.pr), py = eny(En(k));
      if (k < -Math.PI + 1e-6) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.stroke();

    // 布里渊区边界等能提示：k = −π/a 与 k = +π/a 处在能带的同一高度、能量相同（周期边界下实为同一状态），
    // 因此电子可以由此端直接跨越到彼端——这正是面板一中 X（最左端）与空穴（最右端）"相邻"的依据。
    (function(){
      var yTop = eny(1), xL = colX(0), xR = W - P1.pr;
      c.save();
      c.strokeStyle = "#8a8aad"; c.lineWidth = 1.6;
      c.setLineDash([6, 4]);
      c.beginPath(); c.moveTo(xL, yTop); c.lineTo(xR, yTop); c.stroke();
      c.setLineDash([]);
      c.beginPath();
      c.moveTo(xL, yTop - 7); c.lineTo(xL, yTop + 7);
      c.moveTo(xR, yTop - 7); c.lineTo(xR, yTop + 7);
      c.stroke();
      // 右端虚线圆环：与左端格点（k = −π/a）对应的是同一个状态
      c.beginPath(); c.arc(xR, yTop, 5, 0, 6.284);
      c.setLineDash([3, 3]); c.stroke();
      c.setLineDash([]);
      c.restore();
      // y = yTop-28：让开跨区大弧线的顶点（顶点 y≈88，含白色底衬上沿约 84）
      text(c, "布里渊区边界：两端 −π/a 与 +π/a 同一高度、E 相同（同一状态），电子可直接跨越",
           W / 2, yTop - 28, "#6a6a8c", "bold 13px 'Microsoft YaHei'", "center");
    })();

    // 状态列参考线与格点
    c.setLineDash([3,4]); c.lineWidth = 1;
    for (var gi = 0; gi < N; gi++){
      c.beginPath(); c.strokeStyle = "rgba(91,79,196,.20)";
      c.moveTo(colX(gi), eny(En(K[gi]))); c.lineTo(colX(gi), yBase); c.stroke();
    }
    c.setLineDash([]);
    for (var gi2 = 0; gi2 < N; gi2++){
      c.beginPath(); c.arc(colX(gi2), eny(En(K[gi2])), 4, 0, 6.284);
      c.fillStyle = "#ffffff"; c.fill();
      c.strokeStyle = "#c3bfe6"; c.lineWidth = 1.5; c.stroke();
    }

    // 本次跃迁：电子沿能带跃入空位
    if (lastSwap){
      var x1 = colX(lastSwap.from), y1 = eny(En(K[lastSwap.from]));
      var x2 = colX(lastSwap.to),   y2 = eny(En(K[lastSwap.to]));
      var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      // 凸向：取弦的法向、且背离 E-k 能带曲线的一侧。
      // 原做法沿"能带底 → 中点"的径向抬起，在带底附近该方向几乎与能带平行，弧线便贴在曲线上；
      // 改为按局部能带位置判断，保证弧线始终鼓向远离能带的一侧（相邻态约离开 20 px）。
      var ddx = x2 - x1, ddy = y2 - y1, dl = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
      var nx = -ddy / dl, ny = ddx / dl;                     // 弦的单位法向
      var kMid = -Math.PI + (mx - P1.pl) / (W - P1.pl - P1.pr) * 2 * Math.PI;
      var yBand = eny(En(kMid));                             // 同一 x 处能带曲线的高度
      if (ny * (my - yBand) < 0){ nx = -nx; ny = -ny; }      // 统一取"远离能带"的一侧
      var off = dl > 200 ? 30 : 40;                          // 跨区大跨越（X↔空穴）已足够明显，保持原幅度
      var cxP = mx + nx * off, cyP = my + ny * off;
      curveArrow(c, x1, y1, x2, y2, cxP, cyP, lastSwap.color);
      // 文字固定在画布顶部空白带（y=30）：能带顶端在 y=96，圆点字母与"空穴"文字最低也只到 y≈72，
      // 原位置（曲线顶点）会紧贴圆弧、空穴圆圈与"空穴"文字，故上移到顶部条带，与颜色保持对应。
      text(c, lastSwap.label + " 跃入空位", 16, 30, lastSwap.color, "bold 15px 'Microsoft YaHei'");
    }

    // 电子与空穴（按实际占据情况绘制）
    for (var j = 0; j < N; j++){
      var xj = colX(j), yj = eny(En(K[j])), it = slots[j];
      if (it){
        c.beginPath(); c.arc(xj, yj, it.label ? 8.5 : 7, 0, 6.284);
        c.fillStyle = it.color; c.fill();
        c.strokeStyle = "rgba(255,255,255,.9)"; c.lineWidth = 1.5; c.stroke();
        if (it.label && showLabels) text(c, it.label, xj + 13, (yj - 15 < 92) ? yj + 26 : yj - 15, it.color, "bold 17px 'Microsoft YaHei'");
      } else {
        var age = now - flashA;
        if (age < 0.8){
          c.beginPath(); c.arc(xj, yj, 13 + 14 * age, 0, 6.284);
          c.strokeStyle = "rgba(224,83,61," + (0.55 * (1 - age / 0.8)) + ")"; c.lineWidth = 3; c.stroke();
        }
        c.beginPath(); c.arc(xj, yj, 11, 0, 6.284);
        c.fillStyle = "#ffffff"; c.fill();
        c.lineWidth = 4; c.strokeStyle = "#e0533d"; c.stroke();
        text(c, "空穴", xj, (yj - 30 < 72) ? yj + 32 : yj - 30, "#e0533d", "bold 16px 'Microsoft YaHei'", "center");
      }
    }

  }

  function paint(){
    var now = performance.now() / 1000;
    drawPS(now); drawP1(now);
  }

  // 空穴高亮动画（不推进状态，仅重绘）
  (function loop(){ paint(); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
